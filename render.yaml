services:
  - type: web
    name: photo_app
    runtime: node
    region: singapore
    plan: free
    branch: main
    rootDir: project1/backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: FRONTEND_URL
        value: https://photogallery-myapp.netlify.app
      - key: MONGO_URI
        sync: false
